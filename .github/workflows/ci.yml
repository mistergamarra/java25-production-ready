name: Scaffolding Template Release Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  publish-template-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Template Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version Tag
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE:)"
          minor_pattern: "feat:"
          version_format: "{major}.{minor}.{patch}"

      # FIX: Configured the release title name to use the raw version tag string exactly.
      # This prevents sidebar truncation bugs on the left-side release history container.
      - name: Publish Official GitHub Scaffolding Template Baseline Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.semver.outputs.version_tag }}
          name: ${{ steps.semver.outputs.version_tag }}
          generate_release_notes: true
          body: |
            ### 🏗️ Framework-Free Java 25 Microservice Specifications
            
            This release tags a verified, hyper-performant, and production-ready scaffolding baseline layout configuration. Any new microservice instantiated from this version inherits these core engineering bounds out of the box:
            
            ### 📊 Hardened Production Hardware Bounds (Verified)
            *   **RAM Allocation Ceiling:** 64MB total container capacity.
            *   **CPU Utilization Cap:** 0.5 Cores throttling restriction matrix.
            *   **Platform Runtime Specification:** Java 25 (GraalVM Substrate VM).
            
            ### ⚡ Pre-Baked Infrastructure Features
            *   **Project Loom Processing Mesh:** Concurrency managed via Virtual Threads in user-space.
            *   **Zero-Syscall JSON Logger:** Asynchronous memory ring-buffer thread execution.
            *   **Resilient HTTP Client Engine:** Equipped with 3x Exponential Backoff retries.
            *   **Isolated Database Migrations:** Alpine Flyway database migrations handled completely out-of-band.
            
            ---
            *To create a new high-throughput microservice using these optimized baselines, click the **"Use this template"** button.*
          draft: false
          prerelease: false

