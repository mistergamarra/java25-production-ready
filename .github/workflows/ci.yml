name: Scaffolding Template Release Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  publish-template-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Template Context
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so changelogs build accurately

      - name: Generate SemVer Blueprint Version Tag
        id: tag_version
        run: |
          VERSION="v\((date +'\%Y.\%m.\%d')-blueprint-\){{ github.run_number }}"
          echo "version=VERSION" >> GITHUB_OUTPUT
          echo "Calculated Target Architectural Blueprint Release Tag: \$VERSION"

      # FIX: Uses a native shell script multi-line output vector instead of actions/github-script
      # to guarantee compatibility under modern Node 24 runner environments.
      - name: Compile Architectural Change Logs from Commits
        id: release_notes
        run: |
          echo "Parsing recent merge logs to construct technical changelog..."
          # Safely extracts the short commit hashes and logs since last tags
          CHANGELOG=\$(git log --oneline -n 20 --pretty=format:"* %h - %s")
          
          # Safe GitHub Actions multiline string delimiter injection mapping
          echo "body<<EOF" >> \$GITHUB_OUTPUT
          echo "CHANGELOG" >> GITHUB_OUTPUT
          echo "EOF" >> \$GITHUB_OUTPUT

      - name: Publish Official GitHub Scaffolding Template Baseline Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: \${{ steps.tag_version.outputs.version }}
          release_name: Scaffolding Blueprint \${{ steps.tag_version.outputs.version }}
          body: |
            ## 🏗️ Baseline Java 25 Microservice Scaffold Specifications
            
            This release tags a verified, hyper-performant, and production-ready scaffolding baseline layout configuration. Any new microservice instantiated from this version inherits these core engineering bounds out of the box:
            
            ### 📊 Hardened Production Hardware Bounds (Verified)
            *   **RAM Allocation Ceiling:** 64MB total container capacity.
            *   **CPU Utilization Cap:** 0.5 Cores throttling restriction matrix.
            *   **Platform Runtime Specification:** Java 25 (Preview Features Enabled) on Substrate VM.
            
            ### ⚡ Pre-Baked Infrastructure Features
            *   **Project Loom Processing Mesh:** Concurrency managed via Virtual Threads in user-space.
            *   **Zero-Syscall JSON Logger:** Asynchronous memory ring-buffer thread (`System.out.flush()`).
            *   **Resilient HTTP Client Engine:** `PromoClient` with 3x Exponential Backoff retries.
            *   **Isolated Database Migrations:** Alpine Flyway database migrations handled completely out-of-band.
            
            ### 🛠️ Developer Lifecycle Changes in This Version
            \${{ steps.release_notes.outputs.body }}
            
            ---
            *To create a new high-throughput microservice using these optimized baselines, simply click the **"Use this template"** button on the GitHub UI dashboard repository home page.*
          draft: false
          prerelease: false
